  <circle cx="754" cy="76" r="3" fill="#58a6ff" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.250;0.270;0.480;0.500;1"/></circle>
